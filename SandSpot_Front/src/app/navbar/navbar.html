<div class="topbar">
  <div class="brand">Sandspot<span class="dot"></span></div>

  <div class="navlinks">
    <span routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      >Carte</span
    >
    <span routerLink="/mes-alertes" routerLinkActive="active">Mes alertes</span>
  </div>

  <div class="search">🔍 Ville, adresse...</div>

  <div class="topbar-right">
    @if (authService.isLoggedIn()) {
      <div class="bell">🔔<span class="ping"></span></div>
      <div class="avatar" (click)="logout()" title="Se déconnecter">JD</div>
    } @else {
      <button class="login-btn" (click)="openAuthModal()">Se connecter</button>
    }
  </div>
</div>

@if (isAuthModalOpen()) {
  <app-auth (closeModal)="closeAuthModal()"></app-auth>
}
